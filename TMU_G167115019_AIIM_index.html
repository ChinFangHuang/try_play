<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7e8">
<title>世界城市賓果｜World Trip Bingo</title>
<style>
  :root{--ink:#34425b;--muted:#73809a;--coral:#ff826b;--coral-dark:#e96c58;--teal:#48b7ad;--yellow:#ffd66b;--paper:#fffdf8;--line:#f0e4d1;--shadow:0 12px 32px rgba(74,75,100,.11)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:ui-rounded,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:radial-gradient(circle at 8% 5%,#cceaff 0,transparent 22rem),radial-gradient(circle at 94% 18%,#dff3ff 0,transparent 24rem),#eef8ff}
  button,textarea{font:inherit}
  .page{position:relative;z-index:1;width:min(1120px,100%);margin:auto;padding:28px 20px 40px}
  header{text-align:center;position:relative;padding:10px 12px 18px}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;border:1px solid #f3dfbb;background:#fffaf0;color:#927544;border-radius:999px;padding:7px 13px;font-size:.82rem;font-weight:800;letter-spacing:.04em}
  h1{font-size:clamp(2rem,5vw,3.1rem);line-height:1.12;margin:15px 0 8px;letter-spacing:.015em}
  h1 span{color:var(--coral-dark)}
  .subtitle{margin:0;color:var(--muted);font-size:1rem}
  .plane{position:absolute;font-size:2rem;right:9%;top:8px;transform:rotate(-14deg)}
  .city-art{position:fixed;z-index:0;pointer-events:none;left:0;right:0;bottom:0;width:100%;height:245px;opacity:.58}
  .layout{display:grid;grid-template-columns:minmax(270px,330px) minmax(0,1fr);gap:22px;align-items:start;margin-top:20px}
  .panel,.game-panel{background:rgba(255,253,248,.94);border:1px solid rgba(235,221,197,.85);border-radius:24px;box-shadow:var(--shadow)}
  .panel{padding:22px;position:sticky;top:16px}
  .panel h2{font-size:1.12rem;margin:0 0 7px;display:flex;align-items:center;gap:8px}
  .help{margin:0 0 15px;color:var(--muted);font-size:.88rem;line-height:1.6}
  label{display:block;font-weight:800;font-size:.9rem;margin:0 0 8px}
  textarea{width:100%;min-height:205px;resize:vertical;padding:12px 13px;border:1.5px solid #e8dfcf;border-radius:14px;background:#fffefa;color:var(--ink);line-height:1.8;outline:none;transition:.2s}
  textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #48b7ad22}
  .count{display:flex;justify-content:space-between;color:var(--muted);font-size:.79rem;margin:7px 2px 14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;padding:11px 15px;cursor:pointer;font-weight:850;transition:transform .15s,filter .15s;}
  .btn:hover{transform:translateY(-1px);filter:brightness(.98)}
  .btn:active{transform:translateY(0)}
  .btn-primary{background:var(--teal);color:white;box-shadow:0 5px 12px #48b7ad38;width:100%}
  .btn-soft{background:#fff0dc;color:#8c6534}
  .btn-light{background:#f1f4f8;color:#53617a}
  .note{font-size:.78rem;line-height:1.5;color:#8a7890;background:#fff6e8;border-radius:11px;padding:10px 11px;margin:13px 0 0}
  .game-panel{padding:23px;min-width:0}
  .game-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
  .game-top h2{font-size:1.13rem;margin:0}
  .pill{background:#eef8f5;color:#388f87;border-radius:999px;padding:7px 11px;font-weight:800;font-size:.82rem;white-space:nowrap}
  .status{display:flex;align-items:center;justify-content:center;gap:9px;min-height:48px;margin:0 0 14px;border-radius:14px;background:#f7f5ef;color:#718096;font-weight:750;text-align:center;padding:9px 12px;transition:.2s}
  .status.one{background:#fff3d2;color:#956e1a}
  .status.bingo{min-height:112px;padding:20px 16px;background:#ffe5dd;color:#cf493d;border:2px solid #ffb19e;border-radius:18px;box-shadow:0 8px 22px #e96c5830;font-size:clamp(1.45rem,3.3vw,2.55rem);font-weight:950;line-height:1.3;animation:pop .35s ease both}
  .win-overlay{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:12px;border-radius:18px;background:rgba(49,62,84,.30);backdrop-filter:blur(4px)}
  .win-overlay[hidden]{display:none}
  .win-card{width:min(470px,96%);padding:24px 20px 20px;border:3px solid #ffd66b;border-radius:25px;text-align:center;background:linear-gradient(145deg,#fffefa,#fff0d5);box-shadow:0 18px 50px rgba(42,54,78,.28);animation:bingoPop .45s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes bingoPop{from{opacity:0;transform:translateY(18px) scale(.62)}to{opacity:1;transform:translateY(0) scale(1)}}
  .win-decor{font-size:1.6rem;letter-spacing:.35em;margin-bottom:2px}
  .win-title{margin:0;color:#e95748;font-size:clamp(3rem,9vw,5.2rem);font-weight:1000;line-height:1;text-shadow:0 3px 0 #ffd66b,0 7px 12px #e9574840}
  .win-message{margin:12px 0 18px;color:#46536a;font-size:clamp(1.05rem,3vw,1.45rem);font-weight:850;line-height:1.45}
  .win-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
  .win-actions .btn-primary{width:auto;padding:11px 18px}
  @keyframes pop{50%{transform:scale(1.025)}}
  .board-wrap{position:relative;max-width:680px;margin:0 auto}
  .board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
  .cell{aspect-ratio:1/1;min-width:0;border:2px solid #f0e7d8;border-radius:16px;background:#fffefa;color:var(--ink);font-weight:800;font-size:clamp(.76rem,1.4vw,1rem);padding:6px;cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;transition:transform .14s,border-color .14s,background .14s,box-shadow .14s;word-break:break-word}
  .cell:hover{transform:translateY(-2px);border-color:#f2b6a7;box-shadow:0 5px 12px #53617a12}
  .cell.marked{background:#dff4ef;border-color:#70c8bd;color:#237c75}
  .cell.marked::after{content:"✓";position:absolute;right:5px;top:3px;font-size:.8rem;color:#278e84;background:#fff;border-radius:50%;width:19px;height:19px;display:grid;place-items:center}
  .game-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:17px}
  .rules{color:var(--muted);font-size:.82rem;text-align:center;line-height:1.6;margin:15px auto 0;max-width:560px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#34425b;color:white;padding:11px 16px;border-radius:999px;font-weight:750;box-shadow:var(--shadow);transition:.2s;z-index:5;text-align:center;max-width:calc(100vw - 32px)}
  .toast.show{transform:translate(-50%,0);opacity:1}
  footer{text-align:center;color:#9a9eaa;font-size:.78rem;margin-top:20px}
  @media(max-width:820px){.layout{grid-template-columns:1fr}.panel{position:static}.panel textarea{min-height:130px}.plane{right:3%;top:1px}.page{padding:20px 14px 30px}}
  @media(max-width:480px){.page{padding:15px 10px 25px}header{padding-bottom:10px}.plane{font-size:1.5rem;right:4%;top:0} .layout{gap:14px;margin-top:10px}.panel,.game-panel{border-radius:19px;padding:17px}.board{gap:5px}.cell{border-radius:11px;padding:3px;font-size:clamp(.64rem,2.7vw,.82rem)}.cell.marked::after{width:15px;height:15px;font-size:.65rem;right:2px;top:2px}.game-top{align-items:flex-start;flex-direction:column;gap:8px}}
</style>
</head>

<div class="page">
  <header>
    <div class="eyebrow">✈️ TRAVEL GAME · 城市旅行小遊戲</div>
    <div class="plane" aria-hidden="true">🛫</div>
    <h1>世界城市 <span>賓果</span></h1>
    <p class="subtitle">點亮城市，連成兩條線，看看誰先喊出 BINGO！</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="words-heading">
      <h2 id="words-heading">🧳 準備你的城市清單</h2>
      <p class="help">輸入想放進賓果卡的城市，每行一個，也可以用逗號分隔。</p>
      <label for="cityInput">城市名稱</label>
      <textarea id="cityInput" spellcheck="false" aria-describedby="wordHelp"></textarea>
      <div class="count"><span id="cityCount">0 個城市</span><span>至少輸入 1 個</span></div>
      <button class="btn btn-primary" id="makeBoard">🎲 套用詞語，產生新卡</button>
      <p class="note" id="wordHelp">城市少於 25 個時，系統會重複抽取填滿格子；增加城市種類能讓每張卡更有變化。</p>
    </section>

    <section class="game-panel" aria-labelledby="game-heading">
      <div class="game-top">
        <h2 id="game-heading">🗺️ 你的城市賓果卡</h2>
        <span class="pill" id="lineCount">目前 0 條連線</span>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">點選你想到或抽到的城市，開始連線吧！</div>
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="5乘5城市賓果卡"></div>
        <div class="win-overlay" id="winOverlay" hidden>
          <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="winTitle" aria-describedby="winMessage">
            <div class="win-decor" aria-hidden="true">🎉 ✨ 🏆</div>
            <h3 class="win-title" id="winTitle">BINGO！</h3>
            <p class="win-message" id="winMessage">兩條連線完成，恭喜你贏了！</p>
            <div class="win-actions">
              <button class="btn btn-primary" id="playAgain">🎲 再玩一局</button>
              <button class="btn btn-light" id="closeWin">繼續看看</button>
            </div>
          </div>
        </div>
      </div>
      <div class="game-actions">
        <button class="btn btn-soft" id="restart">🔄 重新開始</button>
        <button class="btn btn-light" id="clearMarks">↩ 清除標記</button>
      </div>
      <p class="rules">橫向、直向或斜向完成一條線都算連線。<br>完成 <strong>2 條線</strong>即可獲勝！</p>
    </section>
  </main>
  <footer>🌍 下一站，換你決定！</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const defaults = ['東京','首爾','釜山','台北','北京','倫敦','紐約','巴黎','羅馬','新加坡','曼谷','香港','上海','大阪','京都','福岡','沖繩','悉尼','墨爾本','多倫多','溫哥華','洛杉磯','舊金山','里斯本','巴塞隆納','阿姆斯特丹','伊斯坦堡','杜拜','清邁','河內','雅加達','吉隆坡','馬尼拉','名古屋','札幌'];
  const input = document.getElementById('cityInput');
  const board = document.getElementById('board');
  const status = document.getElementById('status');
  const lineCount = document.getElementById('lineCount');
  const cityCount = document.getElementById('cityCount');
  const toast = document.getElementById('toast');
  const winOverlay = document.getElementById('winOverlay');
  let currentCities = [...defaults];
  let marks = Array(25).fill(false);
  let toastTimer;
  input.value = defaults.join('\n');

  function parseCities() {
    return [...new Set(input.value.split(/[\n,，、;；]+/).map(s => s.trim()).filter(Boolean))];
  }
  function updateCityCount() {
    const n = parseCities().length;
    cityCount.textContent = `${n} 個城市`;
  }
  function shuffled(source) {
    const a = [...source];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function makeCells(cities) {
    const pool = [];
    while (pool.length < 25) pool.push(...shuffled(cities));
    return shuffled(pool).slice(0, 25);
  }
  function renderBoard(cells) {
    board.innerHTML = '';
    cells.forEach((city, i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'cell' + (marks[i] ? ' marked' : '');
      button.textContent = city;
      button.setAttribute('role', 'gridcell');
      button.setAttribute('aria-pressed', String(marks[i]));
      button.setAttribute('aria-label', `${city}${marks[i] ? '，已標記' : ''}`);
      button.addEventListener('click', () => {
        marks[i] = !marks[i];
        button.classList.toggle('marked', marks[i]);
        button.setAttribute('aria-pressed', String(marks[i]));
        button.setAttribute('aria-label', `${city}${marks[i] ? '，已標記' : ''}`);
        updateStatus();
      });
      board.appendChild(button);
    });
    updateStatus();
  }
  function completedLines() {
    const lines = [];
    for (let r = 0; r < 5; r++) lines.push([0,1,2,3,4].map(c => r * 5 + c));
    for (let c = 0; c < 5; c++) lines.push([0,1,2,3,4].map(r => r * 5 + c));
    lines.push([0,6,12,18,24], [4,8,12,16,20]);
    return lines.filter(line => line.every(i => marks[i])).length;
  }
  function updateStatus() {
    const n = completedLines();
    lineCount.textContent = `目前 ${n} 條連線`;
    status.className = 'status';
    if (n >= 2) {
      winOverlay.hidden = false;
      status.classList.add('bingo');
      status.textContent = '🎉 BINGO！兩條連線完成，恭喜你贏了！';
    } else if (n === 1) {
      winOverlay.hidden = true;
      status.classList.add('one');
      status.textContent = '✨ 差一條賓果！再完成一條連線就獲勝了！';
    } else {
      winOverlay.hidden = true;
      status.textContent = '點選你想到或抽到的城市，開始連線吧！';
    }
  }
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }
  function startNewBoard() {
    const cities = parseCities();
    if (!cities.length) {
      showToast('請先輸入至少一個城市名稱。');
      input.focus();
      return;
    }
    currentCities = cities;
    marks = Array(25).fill(false);
    renderBoard(makeCells(currentCities));
  }
  document.getElementById('closeWin').addEventListener('click', () => { winOverlay.hidden = true; });
  document.getElementById('playAgain').addEventListener('click', () => document.getElementById('restart').click());
  document.getElementById('makeBoard').addEventListener('click', startNewBoard);
  document.getElementById('restart').addEventListener('click', () => {
    marks = Array(25).fill(false);
    renderBoard(makeCells(currentCities));
    showToast('新賓果卡已準備好！祝你旅途順利 🍀');
  });
  document.getElementById('clearMarks').addEventListener('click', () => {
    marks = Array(25).fill(false);
    renderBoard([...board.children].map(cell => cell.textContent));
    showToast('已清除所有標記。');
  });
  input.addEventListener('input', updateCityCount);
  updateCityCount();
  renderBoard(makeCells(currentCities));
})();
</script>
</body>
</html>
